<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<rect width="600" height="600" fill="#071421"/>
<!-- land -->
<polygon points="48,48 552,48 552,552 48,552" fill="#1b2d3f"/>
<!-- Alabaster Icelands (top, snowy) -->
<rect x="48" y="48" width="504" height="140" fill="#1c2e3c" rx="4"/>
<!-- Coronet Highlands (center, mountainous) -->
<ellipse cx="270" cy="228" rx="100" ry="80" fill="#182535"/>
<!-- Mount Coronet peaks -->
<g fill="#1e3548">
<polygon points="216,210 240,178 264,210"/><polygon points="246,210 270,178 294,210"/>
<polygon points="276,210 300,178 324,210"/><polygon points="230,246 252,216 274,246"/>
<polygon points="268,246 290,216 312,246"/>
</g>
<!-- Alabaster Icelands peaks -->
<g fill="#1e3548">
<polygon points="100,110 124,80 148,110"/><polygon points="150,100 174,70 198,100"/>
<polygon points="250,100 274,68 298,100"/><polygon points="330,110 354,80 378,110"/>
<polygon points="420,100 444,70 468,100"/>
</g>
<!-- Obsidian Fieldlands (left, grassy) -->
<ellipse cx="228" cy="330" rx="115" ry="90" fill="#162a1e" opacity="0.7"/>
<!-- Crimson Mirelands (right, reddish) -->
<ellipse cx="390" cy="330" rx="110" ry="90" fill="#1e2218" opacity="0.7"/>
<!-- Cobalt Coastlands (bottom center) -->
<ellipse cx="300" cy="440" rx="120" ry="80" fill="#162535" opacity="0.8"/>
<!-- Jubilife Village (hub) -->
<rect x="252" y="378" width="60" height="44" rx="6" fill="#1e2d3f" stroke="#2d4a5e" stroke-width="1.5"/>
<text x="258" y="394" fill="#3d5e72" font-family="system-ui,sans-serif" font-size="6.5" font-weight="600">Cd. Jubileo</text>
<!-- Area connections from Jubilife -->
<g stroke="#2d4a63" stroke-width="2" fill="none" stroke-linecap="round">
<line x1="282" y1="378" x2="228" y2="330"/>
<line x1="282" y1="378" x2="390" y2="330"/>
<line x1="282" y1="378" x2="300" y2="440"/>
<line x1="282" y1="378" x2="270" y2="228"/>
<line x1="282" y1="378" x2="252" y2="138"/>
</g>
<!-- internal area routes -->
<g stroke="#2d4a63" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-dasharray="5,3">
<ellipse cx="228" cy="330" rx="80" ry="65"/>
<ellipse cx="390" cy="330" rx="80" ry="65"/>
<ellipse cx="300" cy="440" rx="90" ry="62"/>
<ellipse cx="270" cy="228" rx="75" ry="60"/>
<ellipse cx="252" cy="138" rx="100" ry="55"/>
</g>
<!-- area name labels -->
<g fill="#2a4a5e" font-family="system-ui,sans-serif" font-size="9" font-weight="700" text-anchor="middle">
<text x="228" y="334">CAMPOS OBSIDIANA</text>
<text x="390" y="334">MARISMAS CARMESÍ</text>
<text x="300" y="444">COSTAS COBALTO</text>
<text x="270" y="232">TIERRAS ALTAS</text>
<text x="252" y="128">TIERRAS HELADAS</text>
</g>
<!-- temple of Sinnoh hint -->
<polygon points="258,88 270,72 282,88" fill="#1e3548"/>
<polygon points="272,88 284,72 296,88" fill="#1e3548"/>
<!-- key location markers -->
<g fill="#3a6285" stroke="#5a92b8" stroke-width="1">
<circle cx="228" cy="330" r="7"/>
<circle cx="390" cy="330" r="7"/>
<circle cx="300" cy="440" r="7"/>
<circle cx="270" cy="228" r="7"/>
<circle cx="252" cy="138" r="7"/>
</g>
<text x="12" y="590" fill="#2a4a65" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3">HISUI</text>
</svg>
