<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<rect width="600" height="600" fill="#071421"/>
<!-- land -->
<polygon points="60,48 540,48 562,140 572,280 550,440 500,520 400,558 300,562 200,558 100,520 50,440 28,280 38,140" fill="#1b2d3f"/>
<!-- Glaseado Mountain (north, snowy) -->
<ellipse cx="300" cy="150" rx="120" ry="70" fill="#1c2e3c"/>
<g fill="#1e3548">
<polygon points="240,130 268,92 296,130"/><polygon points="276,120 304,82 332,120"/>
<polygon points="312,130 340,92 368,130"/>
</g>
<!-- Area Zero (central crater - the key feature of Paldea) -->
<circle cx="300" cy="330" r="90" fill="#0d1a28"/>
<circle cx="300" cy="330" r="78" fill="#0f1e2e"/>
<circle cx="300" cy="330" r="62" fill="#111f30"/>
<circle cx="300" cy="330" r="44" fill="#0d1828"/>
<!-- Area Zero inner glow hint -->
<circle cx="300" cy="330" r="20" fill="none" stroke="#1a3048" stroke-width="1" stroke-dasharray="3,3"/>
<text x="300" y="334" fill="#1e3a52" font-family="system-ui,sans-serif" font-size="8" font-weight="700" text-anchor="middle">ÁREA CERO</text>
<!-- Asado Desert (west, sandy) -->
<ellipse cx="120" cy="300" rx="55" ry="65" fill="#1e2a1a" opacity="0.7"/>
<!-- South Province coastline details -->
<!-- routes radiating outward -->
<g stroke="#2d4a63" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- Mesagoza as hub (300, 330) -->
<!-- South -->
<polyline points="300,330 264,492 252,540"/>
<!-- Southwest -->
<polyline points="300,330 156,390 120,432 96,486"/>
<!-- West -->
<polyline points="300,330 150,300 96,252"/>
<!-- Northwest -->
<polyline points="300,330 210,240 156,198 120,168"/>
<!-- North (to Glaseado) -->
<polyline points="300,330 300,258 300,180 300,150"/>
<!-- Northeast -->
<polyline points="300,330 420,240 468,198 480,162"/>
<!-- East -->
<polyline points="300,330 450,300 504,252"/>
<!-- Southeast -->
<polyline points="300,330 402,372 456,390 504,420"/>
<!-- South east -->
<polyline points="300,330 348,480 378,540"/>
<!-- perimeter road (circumnavigation route) -->
<polyline points="252,540 156,510 96,486 60,420 60,300 96,252 120,168 180,96 300,60 420,96 480,162 540,300 504,420 480,492 378,540 252,540" stroke-dasharray="6,3"/>
</g>
<!-- cities -->
<!-- Mesagoza (large central hub) -->
<circle cx="300" cy="330" r="10" fill="#3a6285" stroke="#5a92b8" stroke-width="1.5"/>
<text x="314" y="326" fill="#8ab8d8" font-family="system-ui,sans-serif" font-size="8" font-weight="700">Lechonse</text>
<g fill="#3a6285" stroke="#5a92b8" stroke-width="1">
<circle cx="264" cy="492" r="5.5"/><circle cx="156" cy="390" r="5.5"/>
<circle cx="96"  cy="252" r="5.5"/><circle cx="156" cy="198" r="6"/>
<circle cx="300" cy="168" r="5.5"/><circle cx="468" cy="198" r="6"/>
<circle cx="504" cy="252" r="5.5"/><circle cx="456" cy="390" r="5.5"/>
<circle cx="348" cy="480" r="5.5"/><circle cx="120" cy="432" r="5.5"/>
<circle cx="480" cy="420" r="5.5"/>
</g>
<!-- city labels -->
<g fill="#6a9cba" font-family="system-ui,sans-serif" font-size="7" font-weight="500">
<text x="224" y="486">Alisma</text><text x="108" y="386">Cortondo</text>
<text x="58"  y="248">Cascarrafa</text><text x="112" y="194">Medali</text>
<text x="256" y="164">Montenevera</text><text x="478" y="194">Levincia</text>
<text x="512" y="248">Artazon</text><text x="464" y="386">Alfornada</text>
<text x="358" y="476">Pv. Cabo Poco</text><text x="72" y="428">Porto Marinada</text>
<text x="488" y="416">Glaseado</text>
</g>
<text x="12" y="590" fill="#2a4a65" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3">PALDEA</text>
</svg>
